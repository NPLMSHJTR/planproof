[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "planproof"
version = "0.1.0"
description = "A small SQL engine with a cost-based join planner, verified row-for-row against SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "planproof contributors" }]
keywords = ["sql", "query-planner", "cost-model", "differential-testing", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: TypeScript",
  "Topic :: Database",
]
dependencies = []

[project.scripts]
planproof = "planproof.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/planproof"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
